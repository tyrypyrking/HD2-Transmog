name: Crash or freeze
description: Game closes or stops responding, including when selecting a custom armor.
title: '[Crash] '
body:
- type: markdown
  attributes:
    value: Please search existing issues first. Unknown details are OK—do not delete your saved variants or recreate
      a glitch just to file a report.
- type: input
  id: versions
  attributes:
    label: Transmog and Bingus versions
    description: Include the exact Transmog version, especially any -debug suffix.
    placeholder: Transmog 0.1.2-debug; Bingus v16
  validations:
    required: true
- type: input
  id: system
  attributes:
    label: Game version and operating system
    description: Windows version, or Linux/Steam Deck with Proton version. Include the game build if known.
    placeholder: Windows 11; game build unknown
  validations:
    required: true
- type: textarea
  id: mods
  attributes:
    label: Other enabled mods and installation
    description: List other mods and your mod manager. If you already tested with only Bingus + Transmog, include
      the result; that test is not required.
    placeholder: Arsenal; Bingus + Transmog only, or list other enabled mods.
  validations:
    required: true
- type: textarea
  id: reproduce
  attributes:
    label: What happened, and how can we reproduce it?
    description: List your steps and the last action before the crash/freeze. Include exact error text, how often
      it happens, and whether the game closes or stays frozen.
    placeholder: '1. Open ship Armory → Armor

      2. Select ...

      Expected: ...

      Actual: ...

      Happens every time / sometimes / once.'
  validations:
    required: true
- type: textarea
  id: armor
  attributes:
    label: Armor and menu involved
    description: Ship Armory or pre-mission Equipment? New or existing variant? Include appearance, base stats,
      passive, and currently worn armor/helmet if known. Mention an existing headless/double-passive loadout, if
      applicable.
- type: textarea
  id: logs
  attributes:
    label: Logs and screenshots
    description: 'Attach files from the affected run, preferably before relaunching:

      - %LOCALAPPDATA%\CowboyBingus\Helldivers2\Logs: HD2Transmog.log, HD2Transmog.previous.log (if present), BingusSharedLoader.log

      - The adjacent Transmog folder: STATUS.txt


      On Linux/Steam Deck, use the same AppData/Local location inside the game''s Proton prefix. Debug-build logging
      is automatic; no marker is needed. Zip the requested files if GitHub rejects .log uploads. If logs are missing,
      say so. Reports are public: redact personal names/paths from logs or screenshots; do not attach your whole
      save folder.'
